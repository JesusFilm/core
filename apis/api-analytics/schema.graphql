extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@shareable"])

interface BaseError {
  message: String
}

type Error implements BaseError
  @shareable
{
  message: String
}

type Mutation {
  siteCreate(input: SiteCreateInput!): MutationSiteCreateResult!

  """
  Deletes the goals and setup-help email records of the sites with these domains that the caller owns, leaving the sites, and returns how many rows it deleted. Plausible's database has no site_id index on those two tables, so deleting a site makes Postgres read each of them in full. Run this over every site you are about to delete first, so those tables are small by the time sitesDelete runs.
  """
  sitesDeletePrepare(domains: [String!]!): MutationSitesDeletePrepareResult!

  """
  Deletes the sites with these domains that the caller owns, and returns how many it deleted. Goals, shared links and memberships go with them (the foreign keys cascade). Events already recorded in ClickHouse are left in place. Deleting many sites is slow unless sitesDeletePrepare has run over them first.
  """
  sitesDelete(domains: [String!]!): MutationSitesDeleteResult!

  """
  Adds `props` to the allowed custom properties of every site the caller owns under `domainPrefix` that lacks any of them, keeping the props each already allows. One query finds the sites to change, so a caller can keep a whole family of sites in step without visiting each. Returns how many sites changed.
  """
  sitesAllowEventProps(input: SitesAllowEventPropsInput!): Int!
}

union MutationSiteCreateResult = Error | MutationSiteCreateSuccess

type MutationSiteCreateSuccess {
  data: Site!
}

union MutationSitesDeletePrepareResult = Error | MutationSitesDeletePrepareSuccess

type MutationSitesDeletePrepareSuccess {
  data: Int!
}

union MutationSitesDeleteResult = Error | MutationSitesDeleteSuccess

type MutationSitesDeleteSuccess {
  data: Int!
}

type Query {
  """
  Sites the caller owns, ordered by id. Page with `after` set to the last id returned.
  """
  sites(domainStartsWith: String, after: String, first: Int): [Site!]!
}

type Site {
  id: String!
  domain: String!
  memberships: [SiteMembership!]!
  sharedLinks: [SiteSharedLink!]!
  goals: [SiteGoal!]!
}

input SiteCreateInput {
  domain: String!
  goals: [String!]
  disableSharedLinks: Boolean

  """
  Custom properties the dashboard shows; Plausible hides any not listed. Called again for a site the caller owns, missing ones are added and none removed.
  """
  allowedEventProps: [String!]
}

type SiteGoal {
  id: String!
  eventName: String
}

type SiteMembership {
  id: String!
  role: String!
}

type SiteSharedLink {
  id: String!
  slug: String!
}

input SitesAllowEventPropsInput {
  """
  Only sites whose domain starts with this, e.g. `api-journeys-campaign-`.
  """
  domainPrefix: String!

  """The custom properties every matching site should allow."""
  props: [String!]!
}