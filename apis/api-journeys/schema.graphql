"""
A team-owned seasonal campaign site: a landing page plus one Region Page every Campaign Region renders, built from Campaign Blocks and pointing visitors at published Journeys. Draft or published like a Template Gallery Page; edited live in place.
"""
type Campaign {
  id: ID!
  teamId: ID!

  """Owning team; the campaign is hard-deleted with it."""
  team: Team!

  """
  Default-language title; also the public page title. Required, at most 100 characters.
  """
  title: String!
  titleTranslations: [TranslatedValue!]!

  """
  Globally unique. The permanent Campaign Address is `/campaign/<slug>` on the root domain. Generated from the title; author-editable.
  """
  slug: String!
  status: CampaignStatus!

  """
  api-languages Language id; always one of `languages`. The default-language value of every Translated Field sits on the field itself.
  """
  defaultLanguageId: ID!
  defaultLanguage: Language!

  """
  The eight most recently used picker colours, newest first, `#RRGGBB` uppercase, no duplicates. Picker convenience; never read by the public page.
  """
  palette: [String!]!

  """
  First publish; never cleared by unpublish. Means "first went live", not "currently live".
  """
  publishedAt: DateTimeISO
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!

  """Page Languages in selector order."""
  languages: [CampaignLanguage!]!

  """The one Campaign Theme row; created with the campaign."""
  theme: CampaignTheme!

  """Exactly the landing page and the Region Page."""
  pages: [CampaignPage!]!

  """
  Every live Campaign Block of the campaign as one flat list (both pages, chrome, Region Lines, owned blocks), ordered by parentOrder; the client trees it by parentBlockId and partitions it by pageId / regionId.
  """
  blocks: [CampaignBlock!]!

  """Every Campaign Region, listed and orphan, in switcher order."""
  regions: [CampaignRegion!]!

  """The seventeen Campaign Strings."""
  strings: [CampaignString!]!
}

"""
What a CampaignButtonBlock does when pressed: a web link, a scroll to a block on the same page, or a navigation to a Campaign Region. One row per button, resolved by the populated column. Typenames are Campaign-prefixed so they never collide with the journeys Action kinds.
"""
interface CampaignAction {
  """The CampaignButtonBlock this action belongs to."""
  parentBlockId: ID!
  parentBlock: CampaignBlock!
}

"""
Shows Campaign Stats: visitor tiles, a ranked country list and optionally the world map. Scope (whole campaign on the landing page, one region on the Region Page) is derived from the page, not stored.
"""
type CampaignAnalyticsBlock implements CampaignBlock & CampaignSectionBlock {
  id: ID!
  campaignId: ID!

  """The Campaign Page this block sits on, if page-scoped."""
  pageId: ID

  """
  The Campaign Region this block belongs to, if region-scoped (a Region Line).
  """
  regionId: ID
  parentBlockId: ID

  """
  Order among siblings. Null on an owned block (a cover, logo or media slot).
  """
  parentOrder: Int
  backgroundKind: CampaignBackgroundKind!

  """Read only when backgroundKind is `custom`. `#RRGGBB`."""
  backgroundColor: String

  """
  The owned CampaignImageBlock; read only when backgroundKind is `image`.
  """
  coverBlockId: ID

  """Read only when backgroundKind is `image`; null means medium."""
  backgroundOverlay: CampaignBackgroundOverlay
  headingColor: String
  textColor: String
  buttonColor: String
  buttonTextColor: String
  accentColor: String
  eyebrow: String
  eyebrowTranslations: [TranslatedValue!]!
  title: String
  titleTranslations: [TranslatedValue!]!
  showMap: Boolean!
}

input CampaignAnalyticsBlockCreateInput {
  id: ID
  campaignId: ID!

  """A page of the campaign."""
  pageId: ID!

  """
  Position among the page’s sections; appended when omitted or past the end.
  """
  parentOrder: Int

  """At most 80 characters."""
  eyebrow: String

  """At most 150 characters."""
  title: String

  """Defaults to false."""
  showMap: Boolean
}

input CampaignAnalyticsBlockUpdateInput {
  """At most 80 characters."""
  eyebrow: String

  """At most 150 characters."""
  title: String
  showMap: Boolean
}

"""
What a Campaign Section sits on. Named kinds are theme-slot references; `custom` reads the section backgroundColor; `image` reads the owned cover block.
"""
enum CampaignBackgroundKind {
