type Query {
  visitor(id: ID!): Visitor!
  visitorsConnection(teamId: String, first: Int, after: String): VisitorsConnection!
  block(id: ID!): Block!
  blocks(where: BlocksFilter): [Block!]!

  """
  Read one Campaign by id in its full admin shape, draft or published.
  
  Auth: campaign Read — any member or manager of the campaign's team.
  
  Errors:
  - NOT_FOUND: id does not resolve.
  - FORBIDDEN: caller is not in the team.
  """
  campaign(id: ID!): Campaign!

  """
  List a team's Campaigns, draft and published, newest first.
  
  Auth: campaign Read — any member or manager of the team.
  
  Errors:
  - NOT_FOUND: the team does not exist.
  - FORBIDDEN: caller is not in the team.
  """
  campaigns(teamId: ID!): [Campaign!]!

  """
  Public, unauthenticated read of a published Campaign for the public page: exactly one of `slug` (the root-domain address) or `hostname` (a Custom Domain whose Campaign Root it is), plus the Page Language to resolve every text field to (null = the campaign default). `status: published` is the only gate.
  
  Errors:
  - BAD_USER_INPUT: both or neither of `slug` and `hostname` given.
  - NOT_FOUND: no published campaign at that key (draft, unknown, or malformed slug).
  """
  campaignPublic(
    """
    The campaign slug; must match `^[a-z0-9]+(-[a-z0-9]+)*$` and be at most 200 characters.
    """
    slug: String

    """A Custom Domain name whose Campaign Root to read."""
    hostname: String

    """
    api-languages Language id of the Page Language; a language the campaign does not have, or null, resolves to the default.
    """
    languageId: ID
  ): CampaignPublic!

  """
  The Campaign's visitor stats from one cached Plausible sweep over every linked journey, summed by the campaign's regions: total visitors and visitors by ISO alpha-2 country for the whole campaign and for each region. The server reads Plausible with the service key; the caller never does.
  
  Auth: a published campaign is readable by anyone, anonymous or authenticated; a draft only with campaign Read.
  
  Errors:
  - NOT_FOUND: id does not resolve, or the campaign is a draft the caller cannot read.
  - Plausible failure with nothing cached: the query errors; with a cached sweep, the last sweep is served.
  """
  campaignStats(id: ID!): CampaignStats!
  customDomains(teamId: ID!): [CustomDomain!]!
  customDomain(id: ID!): CustomDomain!
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  journeyEventsConnection(journeyId: ID!, filter: JourneyEventsFilter, first: Int, after: String): JourneyEventsConnection!
  journeyEventsCount(journeyId: ID!, filter: JourneyEventsFilter): Int!
  hosts(teamId: ID!): [Host!]!
  journeySimpleGet(id: ID!): Json
  googleSheetsSyncs(filter: GoogleSheetsSyncsFilter!): [GoogleSheetsSync!]!
  integrations(teamId: ID!): [Integration!]!
  integrationGooglePickerToken(integrationId: ID!): String!
  adminJourney(id: ID!, idType: IdType = slug): Journey!
  adminJourneys(status: [JourneyStatus!], template: Boolean, teamId: ID, useLastActiveTeamId: Boolean): [Journey!]!
  adminJourneysReport(reportType: JourneysReportType!): PowerBiEmbed
  journey(id: ID!, idType: IdType = slug, options: JourneysQueryOptions): Journey!
  journeys(where: JourneysFilter, options: JourneysQueryOptions): [Journey!]!

  """
  Journeys that embed the given media video, for publishers
  choosing a journey to link from an external surface (e.g. a YouTube
  description CTA).
  
  Matching is on the root video id stored by VideoBlocks whose source is
  internal or unset — YouTube, Cloudflare and Mux blocks hold a provider id in
  the same column and are never candidates, while blocks predating the source
  column hold a media video id and are. When languageId is given it narrows to
  blocks playing that variant; when omitted any variant of the video matches.
  
  Only published, non-template journeys are returned: the caller needs a link
  that a viewer can actually open. Results are not scoped to the publisher's
  teams — the whole point is finding a journey they may not own — and are
  ordered by unique visitor count descending, so the most viewed journey comes
  first.
  """
  journeysByVideo(videoId: ID!, languageId: ID): [Journey!]!
  journeyTemplateLanguageIds: [String!]!
  journeyCollection(id: ID!): JourneyCollection!
  journeyCollections(teamId: ID!): [JourneyCollection]!
  getJourneyProfile: JourneyProfile
  journeysEmailPreference(email: String!): JourneysEmailPreference
  journeyTheme(journeyId: ID!): JourneyTheme

  """
  Returns a CSV formatted string with journey visitor export data including headers and visitor data with event information
  """
  journeyVisitorExport(
    journeyId: ID!
    filter: JourneyEventsFilter
    select: JourneyVisitorExportSelect

    """
    IANA timezone identifier (e.g., "Pacific/Auckland"). Defaults to UTC if not provided.
    """
    timezone: String
  ): String
  journeyVisitorsConnection(filter: JourneyVisitorFilter!, first: Int, after: String, sort: JourneyVisitorSort): JourneyVisitorsConnection!
  journeyVisitorCount(filter: JourneyVisitorFilter!): Int!
  journeysPlausibleStatsAggregate(where: PlausibleStatsAggregateFilter!, id: ID!, idType: IdType = slug): PlausibleStatsAggregateResponse!

  """
  This endpoint allows you to break down your stats by some property.
  If you are familiar with SQL family databases, this endpoint corresponds to
  running `GROUP BY` on a certain property in your stats, then ordering by the
  count.
  Check out the [properties](https://plausible.io/docs/stats-api#properties)
  section for a reference of all the properties you can use in this query.
  This endpoint can be used to fetch data for `Top sources`, `Top pages`,
  `Top countries` and similar reports.
  Currently, it is only possible to break down on one property at a time.
  Using a list of properties with one query is not supported. So if you want
  a breakdown by both `event:page` and `visit:source` for example, you would
  have to make multiple queries (break down on one property and filter on
   another) and then manually/programmatically group the results together in one
   report. This also applies for breaking down by time periods. To get a daily
   breakdown for every page, you would have to break down on `event:page` and
   make multiple queries for each date.
  """
  journeysPlausibleStatsBreakdown(where: PlausibleStatsBreakdownFilter!, id: ID!, idType: IdType = slug): [PlausibleStatsResponse!]!
  journeysPlausibleStatsRealtimeVisitors(id: ID!, idType: IdType = slug): Int!

  """
  This endpoint provides timeseries data over a certain time period.
  If you are familiar with the Plausible dashboard, this endpoint corresponds to the main visitor graph.
  """
  journeysPlausibleStatsTimeseries(where: PlausibleStatsTimeseriesFilter!, id: ID!, idType: IdType = slug): [PlausibleStatsResponse!]!
  templateFamilyStatsAggregate(id: ID!, idType: IdType = slug, where: PlausibleStatsAggregateFilter!): TemplateFamilyStatsAggregateResponse
  templateFamilyStatsBreakdown(
    id: ID!
    idType: IdType = slug
    where: PlausibleStatsBreakdownFilter!

    """
    Filter results to only include the specified events. If null or empty, all events are returned.
    """
    events: [PlausibleEvent!]

    """
    Filter results to only include the specified status. If null or empty, all statuses are returned.
    """
    status: [JourneyStatus!]
  ): [TemplateFamilyStatsBreakdownResponse!]
  qrCode(id: ID!): QrCode!
  qrCodes(where: QrCodesFilter!): [QrCode!]!
  teams: [Team!]!
  team(id: ID!): Team!

  """
  Read a single TemplateGalleryPage by id. Returns both `draft` and `published` rows — use this for in-team authenticated reads (e.g. an admin viewing or QA-ing their own team's drafts). Anonymous viewers must use `templateGalleryPageBySlug`, which only returns published pages.
  
  Auth: caller must be a member of the page's team.
  
  Errors:
  - NOT_FOUND: id does not resolve.
  - FORBIDDEN: caller is not in the page's team.
  """
  templateGalleryPage(
    """Stable page identifier."""
    id: ID!
  ): TemplateGalleryPage!

  """
  Public, unauthenticated read by slug. Returns the TemplateGalleryPage with the given slug, but ONLY if the page is currently `published`. Returns null for: unknown slug, draft slug, malformed slug (does not match `^[a-z0-9]+(-[a-z0-9]+)*$`), or slug exceeding 200 characters. Authenticated readers fetching their own team's drafts should use `templateGalleryPage(id)` or `templateGalleryPages(teamId)` instead.
  """
  templateGalleryPageBySlug(
    """
    Case-sensitive public slug. Must match `^[a-z0-9]+(-[a-z0-9]+)*$` (lowercase letters, digits, and hyphen-separated segments only) and be at most 200 characters. Slugs that fail this shape return null without hitting the database.
    """
    slug: String!
  ): TemplateGalleryPagePublic

  """
  List all TemplateGalleryPages owned by a team — both `draft` and `published` rows — ordered by `createdAt` descending.
  
  Auth: caller must be a member of the requested team.
  """
  templateGalleryPages(
    """Owning team. Caller must be a member."""
    teamId: ID!
  ): [TemplateGalleryPage!]!

  """
  Resolve a pasted embed URL to its normalized iframe `embedUrl` without saving — for the collection media link-field preview. Runs the same validation and normalization as the create/update `media` link path (https check, host allowlist, provider normalization for Canva/YouTube/Google Slides). Authenticated callers only.
  
  Errors (same reason codes as the save path):
  - BAD_USER_INPUT (field: `url`): URL is not https.
  - BAD_USER_INPUT / EMBED_HOST_NOT_ALLOWED: host is not in the embed allowlist.
  - BAD_USER_INPUT / CANVA_UNAVAILABLE, GOOGLE_SLIDES_NOT_PUBLISHED, etc.: provider normalization failed.
  """
  templateGalleryPageEmbedPreview(
    """
    The pasted embed URL to validate and normalize. Must be https and on an allowlisted host; provider URLs (Canva, YouTube, Google Slides) are normalized to their iframe form, and a canva.link short link is resolved to its design URL.
    """
    url: String!
  ): String!
  userInvites(journeyId: ID!): [UserInvite!]
  getUserRole: UserRole
  userTeams(teamId: ID!, where: UserTeamFilterInput): [UserTeam!]!
  userTeam(id: ID!): UserTeam!
  userTeamInvites(teamId: ID!): [UserTeamInvite!]!
}

