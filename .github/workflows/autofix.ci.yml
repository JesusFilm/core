name: autofix.ci
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/*]
  merge_group:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  lint-work:
    # Skip /sync-ce PRs so autofix doesn't reformat CE-managed files.
    # Two load-bearing contracts from .claude/skills/sync-ce/SKILL.md, one per
    # event we care about:
    #   1. Pull request (`pull_request`): branch name contains `-chore-ce-sync-`.
    #   2. Merge queue (`merge_group`): commit message contains
    #      `sync compound-engineering skills and agents` (head_ref is empty here).
    if: >-
      ${{ !contains(github.head_ref, '-chore-ce-sync-') &&
          !contains(github.event.merge_group.head_commit.message, 'sync compound-engineering skills and agents') }}
    runs-on: ${{ (github.repository == 'JesusFilm/core' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))) && format('ci-run-{0}', github.run_id) || 'ubuntu-22.04' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: generate prisma imports
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: prisma-generate
          all: true
        env:
          DISABLE_ERD: true
      - name: Install apollo and graphql for codegen
        run: npm i -g apollo graphql # npm because apollo is deprecated and conflicts with graphql
      - name: Codegen
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: codegen
          all: true
      - name: Apply changed-file fixes
        run: pnpm lint:changed --fix
      - name: Type Check
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: type-check
      - name: Subgraph Check
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: subgraph-check
        env:
          HIVE_TOKEN: ${{ secrets.HIVE_PROD_READ_ONLY_TOKEN }}
      - name: lint branch name
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec validate-branch-name -t $GITHUB_HEAD_REF
      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27
        with:
          commit-message: 'fix: lint issues'

  # Required-check wrapper. Resolves `lint` to SUCCESS when lint-work
  # succeeded OR was skipped (e.g. /sync-ce PRs), and FAILURE otherwise.
  lint:
    needs: lint-work
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Resolve lint-work result
        run: |
          result='${{ needs.lint-work.result }}'
          echo "lint-work concluded: $result"
          # Pass on success or skipped (sync-ce PRs); fail closed on everything else.
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            exit 0
          else
            exit 1
          fi
