name: autofix.ci
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/*]
  merge_group:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  lint-work:
    # Skip /sync-ce PRs so autofix doesn't reformat CE-managed files.
    # Two load-bearing contracts from .claude/skills/sync-ce/SKILL.md, one per
    # event we care about:
    #   1. Pull request (`pull_request`): branch name contains `-chore-ce-sync-`.
    #   2. Merge queue (`merge_group`): commit message contains
    #      `sync compound-engineering skills and agents` (head_ref is empty here).
    if: >-
      ${{ !contains(github.head_ref, '-chore-ce-sync-') &&
          !contains(github.event.merge_group.head_commit.message, 'sync compound-engineering skills and agents') }}
    runs-on: >-
      ${{ (github.repository == 'JesusFilm/core' && github.event_name == 'pull_request' && vars.JFP00_PR_AUTHORS != '' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && (contains(fromJSON(vars.JFP00_PR_AUTHORS || '[]'), github.event.pull_request.user.login) || (github.event.pull_request.user.login == 'tataihono' && github.event.pull_request.head.ref == '00-00-CI-chore-i10n-updates' && github.event.pull_request.title == 'chore: new crowdin translations'))) && 'jfp-proxmox-core' || 'blacksmith-4vcpu-ubuntu-2204' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ !startsWith(runner.name, 'gh-runner-jfp-core-') && 'pnpm' || '' }}
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install
      - name: generate prisma imports
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: prisma-generate
          all: true
        env:
          DISABLE_ERD: true
      - name: Install apollo and graphql for codegen
        # npm, not pnpm: apollo is the deprecated CLI and depends on graphql 14/15,
        # which conflicts with the repo's graphql 16, so it cannot be a
        # devDependency. npm nests graphql 14.7.0 under apollo, and the top-level
        # graphql is still required: @apollo/federation inside apollo requires
        # graphql 15+ rule files that 14.7.0 lacks, and Node's resolver finds them
        # by walking up to this root copy. Any graphql >= 15 works there; 16.10.0
        # was the repo's version when the pin was taken. Keep these pins in sync
        # with .devcontainer/post-create-command.sh, tools/scripts/setup-local.sh
        # and AGENTS.md.
        run: npm i -g apollo@2.34.0 graphql@16.10.0
      - name: Record Apollo GraphQL version for codegen cache
        run: |
          node - "$(npm root -g)" <<'NODE' >> "$GITHUB_ENV"
          const path = require('node:path')
          const { createRequire } = require('node:module')
          const requireFromApollo = createRequire(path.join(process.argv[2], 'apollo/package.json'))
          console.log(`APOLLO_GRAPHQL_VERSION=${requireFromApollo('graphql/package.json').version}`)
          NODE
      - name: Codegen
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: codegen
          all: true
      - name: Apply changed-file fixes
        run: pnpm lint:changed --fix
      - name: Type Check
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: type-check
      - name: Subgraph Check
        uses: mansagroup/nrwl-nx-action@v3
        with:
          targets: subgraph-check
        env:
          HIVE_TOKEN: ${{ secrets.HIVE_PROD_READ_ONLY_TOKEN }}
      - name: lint branch name
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec validate-branch-name -t $GITHUB_HEAD_REF
      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27
        with:
          commit-message: 'fix: lint issues'

  # Required-check wrapper. Resolves `lint` to SUCCESS when lint-work
  # succeeded OR was skipped (e.g. /sync-ce PRs), and FAILURE otherwise.
  lint:
    needs: lint-work
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Resolve lint-work result
        run: |
          result='${{ needs.lint-work.result }}'
          echo "lint-work concluded: $result"
          # Pass on success or skipped (sync-ce PRs); fail closed on everything else.
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            exit 0
          else
            exit 1
          fi
