name: Housekeeping - Cron Jobs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  remove-stale-branches:
    runs-on: ${{ (github.repository == 'JesusFilm/core' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))) && format('ci-run-{0}', github.run_id) || 'ubuntu-22.04' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale branches
        uses: fpicalausa/remove-stale-branches@v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          exempt-branches-regex: '^(main|master|feature/.*)$'
          ignore-branches-with-open-prs: true
          operations-per-run: 250
          days-before-branch-stale: 90
          days-before-branch-delete: 7
  remove-stale-prs:
    runs-on: ${{ (github.repository == 'JesusFilm/core' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) || (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))) && format('ci-run-{0}', github.run_id) || 'ubuntu-22.04' }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: 28
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: |
            This pull request has been marked stale due to 28 days without activity. It will be closed in 14 days unless updated.
          close-pr-message: |
            This pull request was automatically closed after remaining stale for 14 days.
          exempt-pr-labels: feature-branch
