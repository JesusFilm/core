name: Gitleaks

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '25 23 * * 0'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan for exposed secrets
    runs-on: jfp-proxmox-core
    timeout-minutes: 20
    steps:
      - name: Check out source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The MIT-licensed CLI does not require a Gitleaks Action license key.
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan commits without publishing secret values
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          event_name = os.environ['GITHUB_EVENT_NAME']
          log_opts = '--all'
          mode = 'full fetched history'

          def valid_commit(value):
              return isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value) and value != '0' * 40

          def has_commit(value):
              return valid_commit(value) and subprocess.run(
                  ['git', 'cat-file', '-e', value + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0

          if event_name == 'pull_request':
              base = event['pull_request']['base']['sha']
              head = event['pull_request']['head']['sha']
              if not has_commit(base) or not has_commit(head):
                  sys.exit('Cannot resolve the pull request commit range; refusing an incomplete scan.')
              # The rollout PR checks history too, so existing findings are visible
              # before activation. Later PRs check every commit in their range.
              already_installed = subprocess.run(
                  ['git', 'cat-file', '-e', base + ':.github/workflows/gitleaks.yml'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if already_installed:
                  log_opts = base + '..' + head
                  mode = 'pull request commits'
          elif event_name == 'push':
              base, head = event.get('before'), event.get('after')
              if has_commit(base) and has_commit(head):
                  log_opts = base + '..' + head
                  mode = 'pushed commits'

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          report = temp / 'gitleaks-findings.json'
          log = temp / 'gitleaks-redacted.log'
          with log.open('w') as output:
              result = subprocess.run([
                  'gitleaks', 'git', '.', '--redact=100', '--no-banner',
                  '--exit-code=42', '--report-format=json', '--report-path=' + str(report),
                  '--log-opts=' + log_opts,
              ], stdout=output, stderr=subprocess.STDOUT)

          # Only counts leave the temporary report. Do not upload findings or logs:
          # even redacted reports can disclose sensitive paths and commit metadata.
          count = None
          if report.exists():
              findings = json.loads(report.read_text())
              if isinstance(findings, list):
                  count = len(findings)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Gitleaks\n\nVersion: 8.30.1\n\nScope: ' + mode + '\n\n')
              if result.returncode == 0 and count == 0:
                  summary.write('No secrets detected in the scanned commits.\n')
              elif result.returncode == 42 and count and count > 0:
                  summary.write(str(count) + ' potential secret(s) detected. Maintainers must investigate privately and revoke or rotate exposed credentials. Removing a value from the latest file does not remove it from history.\n')
              else:
                  summary.write('Scanner execution or report validation failed; this is not a clean scan.\n')
          if result.returncode == 42 and count and count > 0:
              sys.exit('Potential secrets detected. Investigate privately; no findings were published.')
          if result.returncode != 0 or count != 0:
              sys.exit('Scanner execution or report validation failed.')
