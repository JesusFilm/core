name: MCP saved edit integration

on:
  pull_request:
    paths:
      - 'apis/api-auth/**'
      - 'apis/api-mcp/**'
      - 'apis/api-gateway/**'
      - 'apis/api-journeys/**'
      - 'apis/api-media/**'
      - 'libs/yoga/src/mcp/**'
      - 'libs/prisma/auth/**'
      - 'libs/prisma/journeys/**'
      - 'libs/prisma/media/**'
      - 'tools/scripts/test-mcp-edits.mjs'
      - 'tools/scripts/test-mcp-structure.mjs'
      - 'tools/scripts/test-mcp-media.mjs'
      - 'tools/scripts/test-mcp-image-upload.mjs'
      - '.github/workflows/mcp-edits.yml'

permissions:
  contents: read

jobs:
  media:
    runs-on: jfp-proxmox-core
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: media-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise source discovery, atomic attachment and media inverses
        run: node tools/scripts/test-mcp-media.mjs
        env:
          MCP_MEDIA_TEST_POSTGRES_URL: postgresql://postgres:media-test@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Preserve media coverage and executed test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-media-coverage
          path: coverage/integration/mcp-media
          if-no-files-found: error
      - name: Upload owning media coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration/mcp-media/cobertura-coverage.xml
          flags: integration.mcp-media
          disable_search: true
          fail_ci_if_error: true
  image-upload:
    runs-on: jfp-proxmox-core
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: image-upload-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise same-job image ingress, recovery, cancellation and separate attachment
        run: node tools/scripts/test-mcp-image-upload.mjs
        env:
          MCP_UPLOAD_TEST_POSTGRES_URL: postgresql://postgres:image-upload-test@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Preserve media coverage and executed test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-image-upload-coverage
          path: coverage/integration/mcp-image-upload
          if-no-files-found: error
      - name: Upload owning image job coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration/mcp-image-upload/cobertura-coverage.xml
          flags: integration.mcp-image-upload
          disable_search: true
          fail_ci_if_error: true
  saved-edits:
    runs-on: jfp-proxmox-core
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: edit-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise OAuth, MCP, gateway and atomic owning execution
        run: node tools/scripts/test-mcp-edits.mjs
        env:
          MCP_EDITS_TEST_POSTGRES_URL: postgresql://postgres:edit-test@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Exercise structural edits, routes and complete inverses
        run: node tools/scripts/test-mcp-structure.mjs
        env:
          MCP_STRUCTURE_TEST_POSTGRES_URL: postgresql://postgres:edit-test@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Preserve owning-service coverage and test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-saved-edit-coverage
          path: coverage/integration/mcp-edits
          if-no-files-found: error
      - name: Upload saved edit coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration/mcp-edits/cobertura-coverage.xml
          flags: integration.mcp-edits
          disable_search: true
          fail_ci_if_error: true
      - name: Preserve structural coverage and test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-structural-coverage
          path: coverage/integration/mcp-structure
          if-no-files-found: error
      - name: Upload structural coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration/mcp-structure/cobertura-coverage.xml
          flags: integration.mcp-structure
          disable_search: true
          fail_ci_if_error: true
