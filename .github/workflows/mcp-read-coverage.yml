name: MCP read, renewal and withdrawal coverage

on:
  pull_request:
    # Include stacked PR bases as well as the integration and main branches.
    paths:
      - 'apis/api-auth/**'
      - 'apis/api-mcp/**'
      - 'apis/api-gateway/**'
      - 'apis/api-journeys/**'
      - 'libs/prisma/**'
      - 'libs/yoga/**'
      - 'libs/journeys/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/mcp-read-coverage.yml'

permissions:
  contents: read

concurrency:
  group: mcp-read-coverage-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mcp-read-coverage:
    needs: base-coverage
    if: ${{ !cancelled() && (needs.base-coverage.result == 'success' || needs.base-coverage.result == 'skipped') }}
    runs-on: jfp-proxmox-core
    # Full project coverage takes about an hour; allow uploads and cleanup to finish.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mcp-read-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients for the real application participants
        run: pnpm exec nx run-many -t prisma-generate --all
        env:
          DISABLE_ERD: true
      - name: Migrate isolated databases and collect full-path coverage without skips
        run: pnpm exec nx run api-auth:test-coverage
        env:
          MCP_READS_TEST_POSTGRES_URL: postgresql://postgres:mcp-read-test@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Retain test and cross-service coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-read-coverage
          path: coverage/apis/api-auth
          if-no-files-found: error
      - name: List the explicit project coverage reports
        id: coverage-reports
        run: |
          python3 - <<'PY_REPORTS'
          import glob, os
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob('coverage/**/cobertura-coverage.xml', recursive=True))
          if not files:
              raise SystemExit('No project coverage reports were produced')
          empty = [path for path in files if int(ET.parse(path).getroot().get('lines-valid', '0')) == 0]
          for path in empty:
              print('Empty report is not coverage evidence:', path)
          files = [path for path in files if path not in empty]
          if not files:
              raise SystemExit('No non-empty project coverage reports were produced')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('files=' + ','.join(files) + '\n')
          print('Verified', len(files), 'non-empty project coverage reports')
          PY_REPORTS
      - name: Merge full-path execution hits into Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.files }}
          flags: mcp-complete-projects
          disable_search: true
          fail_ci_if_error: true
  base-coverage:
    # Main already uploads its own reports. Feature/stack bases need a baseline.
    if: github.base_ref != 'main'
    runs-on: jfp-proxmox-core
    # The same full project suites run on the base before reports are uploaded.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mcp-read-test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preserve coverage tooling for the base checkout
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-base-coverage"
          cp apis/api-auth/test/{runCoverage,verifyCoverage}.ts apis/api-auth/vitest.config.mts "$RUNNER_TEMP/mcp-base-coverage/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Instrument the unchanged base implementation
        run: |
          cp "$RUNNER_TEMP/mcp-base-coverage/"{runCoverage,verifyCoverage}.ts apis/api-auth/test/
          cp "$RUNNER_TEMP/mcp-base-coverage/vitest.config.mts" apis/api-auth/
      - name: Generate base Prisma clients
        run: pnpm exec nx run-many -t prisma-generate --all
        env:
          DISABLE_ERD: true
      - name: Collect all base project reports and real protocol coverage
        run: pnpm exec tsx apis/api-auth/test/runCoverage.ts --baseline
        env:
          MCP_READS_TEST_POSTGRES_URL: postgresql://postgres:mcp-read-test@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Retain exact-base coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-base-coverage
          path: coverage
          if-no-files-found: error
      - name: List the explicit project coverage reports
        id: coverage-reports
        run: |
          python3 - <<'PY_REPORTS'
          import glob, os
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob('coverage/**/cobertura-coverage.xml', recursive=True))
          if not files:
              raise SystemExit('No project coverage reports were produced')
          empty = [path for path in files if int(ET.parse(path).getroot().get('lines-valid', '0')) == 0]
          for path in empty:
              print('Empty report is not coverage evidence:', path)
          files = [path for path in files if path not in empty]
          if not files:
              raise SystemExit('No non-empty project coverage reports were produced')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('files=' + ','.join(files) + '\n')
          print('Verified', len(files), 'non-empty project coverage reports')
          PY_REPORTS
      - name: Upload reports against the actual base commit
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.files }}
          disable_search: true
          flags: mcp-complete-projects
          override_commit: ${{ github.event.pull_request.base.sha }}
          override_branch: ${{ github.base_ref }}
          fail_ci_if_error: true
