# Backing services (db, redis, maildev, plausible, ...) live in the root
# docker-compose.services.yml so they can also be run without the dev container.
# They are merged into this compose project, so volume names are unchanged.
include:
  - ../docker-compose.services.yml
services:
  bootstrap:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    volumes:
      - core-workspace:/workspaces
      - core-node-user:/home/node
    entrypoint: ['/bin/bash', '-lc']
    command:
      - |
        LOGFILE=/workspaces/bootstrap.log
        touch $LOGFILE
        exec > >(tee -a "$LOGFILE") 2>&1
        set -euxo pipefail
        echo "=== Starting bootstrap at $(date) ==="

        mkdir -p /workspaces/core
        cd /workspaces/core

        # trust the path for Git (avoids 'dubious ownership')
        git config --global --add safe.directory /workspaces/core

        # --- quick "already done?" guard ---
        if git rev-parse --is-inside-work-tree >/dev/null 2>&1 \
          && [ "$(git remote get-url origin 2>/dev/null || echo '')" = "https://github.com/JesusFilm/core.git" ] \
          && git ls-remote --exit-code origin main >/dev/null 2>&1; then
          echo "Repo already bootstrapped; skipping clone/sync."
          exit 0
        fi
        # -----------------------------------

        # fresh init with 'main' as the initial branch (no 'master')
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          [ -d .git ] && rm -rf .git
          git init -b main
        fi

        if git remote get-url origin >/dev/null 2>&1; then
          git remote set-url origin https://github.com/JesusFilm/core.git
        else
          git remote add origin https://github.com/JesusFilm/core.git
        fi

        git fetch --depth 1 origin main
        git checkout -B main origin/main
        git reset --hard origin/main

        chown -R 1000:1000 /workspaces
        echo "BOOTSTRAP_OK at $(date)"
        exit 0
  app:
    build:
      context: .
      target: final
      dockerfile: Dockerfile
      args:
        VARIANT: 22
        USER_UID: 1000
        USER_GID: 1000
    volumes:
      - core-workspace:/workspaces
      - core-node-user:/home/node
    # Run an init process as PID 1 so exited children are reaped. Without it
    # `sleep infinity` is PID 1 and never reaps, so tooling that spawns and
    # abandons children accumulates zombies over a long-lived session.
    init: true
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    # Uncomment the next line to use a non-root user for all processes.
    # user: node
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    environment:
      KUBECONFIG: /workspaces/core/.kube/config
      PGHOST: db
      PGPASSWORD: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      bootstrap:
        condition: service_completed_successfully
volumes:
  core-node-user:
  core-workspace:
