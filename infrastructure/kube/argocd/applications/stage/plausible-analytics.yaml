apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plausible-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JesusFilm/core
    path: infrastructure/kube/plausible-analytics
    targetRevision: stage
    helm:
      valueFiles:
        - values-stage.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      # Pruning is off until the first sync from the real chart path has been
      # reviewed. The live release was installed by helm upgrade from
      # apis/api-analytics/infrastructure/deploy-stage.sh, so every live object
      # carries the plausible-analytics instance label, and a pruning sync
      # would delete anything with that label the chart does not render, the
      # ClickHouse PVCs included. Re-enable once `argocd app diff` is clean
      # (infrastructure/kube/plausible-analytics/README.md, "Before you start").
      prune: false
      selfHeal: true
      enabled: true
